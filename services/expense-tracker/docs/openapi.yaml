openapi: 3.0.3
info:
  title: Expense Tracker Service API
  version: 1.0.0
  description: HTTP API exposed by the expense tracker service.
servers:
  - url: http://localhost:8486
    description: Direct local service for debugging
  - url: '{gatewayUrl}/expenses'
    description: Kong gateway in development or staging
    variables:
      gatewayUrl:
        default: http://localhost:8000
        description: Public base URL of the Kong gateway. Set this to the staging gateway URL when testing staging.
paths:
  /:
    get:
      summary: Check service health
      operationId: getHealth
      responses:
        '200':
          description: Service is running.
          content:
            text/plain:
              schema:
                type: string
              example: Expense Tracker Service API is running!
  /expense-log:
    post:
      summary: Create an expense event log
      operationId: createExpenseLog
      responses:
        '200':
          description: Expense event log created.
          content:
            text/plain:
              schema:
                type: string
              example: Expense log created!
        '500':
          $ref: '#/components/responses/InternalServerError'
  /cache:
    post:
      summary: Set the default cache value
      description: Stores `expense_value` under `expense_key` for one hour.
      operationId: setCache
      responses:
        '200':
          description: Cache value set.
          content:
            text/plain:
              schema:
                type: string
              example: Cache set!
        '500':
          $ref: '#/components/responses/InternalServerError'
  /cache/{key}:
    get:
      summary: Get a cached value
      operationId: getCacheValue
      parameters:
        - $ref: '#/components/parameters/CacheKey'
      responses:
        '200':
          description: Cached value.
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Cache key was not found.
          content:
            text/plain:
              schema:
                type: string
components:
  parameters:
    CacheKey:
      name: key
      in: path
      required: true
      description: Cache key to retrieve.
      schema:
        type: string
      example: expense_key
  responses:
    InternalServerError:
      description: A backing service failed to complete the request.
      content:
        text/plain:
          schema:
            type: string
