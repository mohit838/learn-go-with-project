apisix:
  node_listen: 9080
  enable_admin: true
  enable_admin_cors: true

deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  etcd:
    host:
      - http://etcd:2379
    prefix: /apisix
  admin:
    allow_admin:
      - 0.0.0.0/0
    admin_key:
      - name: admin
        key: dev_apisix_admin_key
        role: admin

stream_plugins: []

nginx_config:
  error_log: /dev/stderr
  http:
    access_log: /dev/stdout
