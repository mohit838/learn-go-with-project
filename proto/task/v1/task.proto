syntax = "proto3";

package task.v1;

option go_package = "github.com/mohit838/learn-go-with-project/internal/grpc/taskv1;taskv1";

service TaskService {
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
}

message GetTaskRequest {
  int64 id = 1;
}

message GetTaskResponse {
  int64 id = 1;
  string title = 2;
  string description = 3;
  string status = 4;
  bool is_active = 5;
  string created_at = 6;
  string updated_at = 7;
}
