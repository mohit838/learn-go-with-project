services:
  etcd:
    image: gcr.io/etcd-development/etcd:v3.6.12
    command:
      - /usr/local/bin/etcd
      - --name=apisix-etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=apisix-etcd=http://etcd:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=apisix-etcd
    volumes:
      - apisix-etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "endpoint", "health", "--endpoints=http://127.0.0.1:2379"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  apisix:
    image: apache/apisix:3.11.0-debian
    depends_on:
      etcd:
        condition: service_healthy
    ports:
      - "9088:9080"
      - "9180:9180"
    volumes:
      - ./apisix/config-gui.yaml:/usr/local/apisix/conf/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  apisix-dashboard:
    image: apache/apisix-dashboard:3.0.1-alpine
    depends_on:
      etcd:
        condition: service_healthy
    ports:
      - "9181:9000"
    volumes:
      - ./apisix/dashboard.yaml:/usr/local/apisix-dashboard/conf/conf.yaml:ro
    restart: unless-stopped

  apisix-bootstrap:
    image: curlimages/curl:8.11.1
    depends_on:
      - apisix
    volumes:
      - ./apisix/bootstrap:/bootstrap:ro
    command: ["/bin/sh", "/bootstrap/bootstrap.sh"]
    restart: "no"

volumes:
  apisix-etcd-data:
