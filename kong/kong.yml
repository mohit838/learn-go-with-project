_format_version: "3.0"
_transform: true

plugins:
  - name: cors
    config:
      origins:
        - http://localhost:3000
        - http://localhost:5173
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - X-Request-ID
      exposed_headers:
        - X-Request-ID
      credentials: true
      max_age: 300
      preflight_continue: false

services:
  - name: auth-service
    url: http://auth:8484
    routes:
      - name: auth-route
        paths:
          - /auth
        strip_path: true
        plugins:
          - name: rate-limiting
            config:
              minute: 60
              policy: local
              limit_by: ip
              hide_client_headers: false

  - name: task-tracker-service
    url: http://task-tracker:8485
    routes:
      - name: task-tracker-route
        paths:
          - /tasks
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 300
              policy: local
              limit_by: ip
              hide_client_headers: false

      - name: task-tracker-graphql-route
        paths:
          - /graphql
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 300
              policy: local
              limit_by: ip
              hide_client_headers: false

  - name: expense-tracker-service
    url: http://expense-tracker:8486
    routes:
      - name: expense-tracker-route
        paths:
          - /expenses
        strip_path: true
        plugins:
          - name: rate-limiting
            config:
              minute: 300
              policy: local
              limit_by: ip
              hide_client_headers: false
