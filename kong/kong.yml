                  end
                  kong.service.request.set_header("X-User-ID", claim("sub"))
                  kong.service.request.set_header("X-Tenant-ID", claim("tenant_id"))
                  kong.service.request.set_header("X-Tenant-Slug", claim("tenant"))
                  kong.service.request.set_header("X-User-Role", claim("role"))
          - name: rate-limiting
            config:
              minute: 300
              policy: local
              limit_by: ip
              hide_client_headers: false

  - name: expense-tracker-service
    url: http://expense-tracker:8486
    routes:
      - name: expense-tracker-route
        paths:
          - /expenses
        strip_path: true
        plugins:
          - name: rate-limiting
            config:
              minute: 300
              policy: local
              limit_by: ip
              hide_client_headers: false
