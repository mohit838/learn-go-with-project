_format_version: "3.0"
_transform: true

services:
  - name: auth-service-local
    url: http://host.docker.internal:8484
    plugins:
      - name: cors
        config:
          origins:
            - http://localhost:3000
          methods: [GET, HEAD, PUT, PATCH, POST, DELETE, OPTIONS]
          headers: [Accept, Authorization, Content-Type, X-Request-ID]
          exposed_headers: [X-Request-ID]
          max_age: 3600
      - name: rate-limiting
        config:
          minute: 60
          policy: local
    routes:
      - name: auth-route-local
        paths:
          - /auth
        strip_path: true

  - name: task-tracker-service-local
